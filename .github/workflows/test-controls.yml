name: Shared control tests
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: shared-control-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s . -p test_integrity.py -v
      - name: Check embedded implementation matches tested source
        run: |
          python3 generate_workflow.py
          git diff --exit-code -- .github/workflows/source-integrity.yml
